name: Build AyaPy 3.0

on:
workflow_dispatch:
push:
paths:
- 'AyaPy-3.0-Source.zip'
- '.github/workflows/build-apk.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Extract AyaPy source
    run: |
      unzip -q AyaPy-3.0-Source.zip -d extracted
      test -f extracted/AyaPy-Ultimate/settings.gradle.kts

  - name: Build debug APK
    run: |
      cd extracted/AyaPy-Ultimate
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AyaPy-3.0-APK
      path: extracted/AyaPy-Ultimate/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
